<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 104" role="img" aria-label="Enter the Drift — About Me at armalv.github.io">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10121a"/>
      <stop offset="1" stop-color="#0a0b0f"/>
    </linearGradient>
    <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e4ba5e"/>
      <stop offset="1" stop-color="#8a6f38"/>
    </linearGradient>
    <radialGradient id="bglow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#e4ba5e" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#e4ba5e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="3" y="3" width="474" height="98" rx="18" fill="url(#bbg)" stroke="url(#goldline)" stroke-width="1.5"/>
  <rect x="3" y="3" width="474" height="98" rx="18" fill="url(#bglow)"/>

  <!-- left sparkle -->
  <g fill="#e4ba5e">
    <polygon points="0,-13 2.3,-2.3 13,0 2.3,2.3 0,13 -2.3,2.3 -13,0 -2.3,-2.3" transform="translate(46,52)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <text x="82" y="46" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="3" fill="#f6dda0">ENTER THE DRIFT</text>
  <text x="82" y="74" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="1.5" fill="#99a0b0">About Me &#160;·&#160; armalv.github.io</text>

  <text x="436" y="60" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#e4ba5e">&#8594;</text>
</svg>
