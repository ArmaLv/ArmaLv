<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Arma — a student and aspiring solo dev, drifting between code and art">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0b0f"/>
      <stop offset="1" stop-color="#111320"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="-0.1" r="0.95">
      <stop offset="0" stop-color="#e4ba5e" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#e4ba5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="1.12" r="0.85">
      <stop offset="0" stop-color="#7d93c8" stop-opacity="0.12"/>
      <stop offset="0.6" stop-color="#7d93c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="namegrad" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#f8e3ad"/>
      <stop offset="1" stop-color="#e4ba5e"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect width="1200" height="300" fill="url(#glow2)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="3" fill="none" stroke="#e4ba5e" stroke-opacity="0.18"/>

  <!-- sparkle cluster -->
  <g fill="#e4ba5e">
    <polygon points="0,-13 2.3,-2.3 13,0 2.3,2.3 0,13 -2.3,2.3 -13,0 -2.3,-2.3" transform="translate(905,70)" opacity="0.9">
      <animate attributeName="opacity" values="0.35;0.95;0.35" dur="4.5s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-9 1.6,-1.6 9,0 1.6,1.6 0,9 -1.6,1.6 -9,0 -1.6,-1.6" transform="translate(1010,135)" opacity="0.7">
      <animate attributeName="opacity" values="0.25;0.8;0.25" dur="5.5s" begin="0.8s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-16 2.8,-2.8 16,0 2.8,2.8 0,16 -2.8,2.8 -16,0 -2.8,-2.8" transform="translate(1085,205)" opacity="0.85">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="6s" begin="0.3s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-7 1.3,-1.3 7,0 1.3,1.3 0,7 -1.3,1.3 -7,0 -1.3,-1.3" transform="translate(965,235)" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" begin="1.4s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-6 1.1,-1.1 6,0 1.1,1.1 0,6 -1.1,1.1 -6,0 -1.1,-1.1" transform="translate(1130,95)" opacity="0.5">
      <animate attributeName="opacity" values="0.15;0.65;0.15" dur="5s" begin="0.6s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- name glow underlay -->
  <text x="68" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="78" fill="#e4ba5e" opacity="0.35" filter="url(#soft)">Arma</text>

  <!-- text -->
  <text x="70" y="90" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" letter-spacing="8" fill="#e4ba5e" opacity="0.9">GLORY ON HIGH</text>
  <text x="66" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="76" fill="#edeff5">Hi, I'm <tspan fill="url(#namegrad)" font-style="italic">Arma</tspan></text>
  <text x="70" y="210" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#99a0b0">A student &amp; aspiring solo dev — drifting between <tspan fill="#c3b183">code</tspan> and <tspan fill="#c3b183">art</tspan>.</text>

  <line x1="71" y1="240" x2="300" y2="240" stroke="#e4ba5e" stroke-opacity="0.45"/>
  <polygon points="0,-6 1.1,-1.1 6,0 1.1,1.1 0,6 -1.1,1.1 -6,0 -1.1,-1.1" transform="translate(316,236)" fill="#e4ba5e"/>
  <text x="71" y="272" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#c3b183">armalv.github.io &#160;·&#160; enter the drift</text>
</svg>
